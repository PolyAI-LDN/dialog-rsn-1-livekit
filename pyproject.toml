[project]
name = "dialog-rsn-1-livekit"
version = "0.1.0"
description = "A LiveKit Agents voice agent on Dialog-RSN-1"
requires-python = ">=3.10"
dependencies = [
    # dialog_rsn_1.py subclasses the OpenAI Realtime plugin's internals, so stay on the
